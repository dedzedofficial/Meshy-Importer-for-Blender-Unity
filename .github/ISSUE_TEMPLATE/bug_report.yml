name: Bug report
description: Report an import or installation problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: importer
    attributes:
      label: Importer version
      placeholder: "1.4.1 (Unity / Blender / Godot / Unreal)"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host application and version
      placeholder: "Unity 2022.3.x, Blender 5.x, Godot 4.3 or Unreal 5.4"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console/error output
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
