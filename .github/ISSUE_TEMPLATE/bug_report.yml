name: Bug report
description: Report an import or installation problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: importer
    attributes:
      label: Importer version
      description: Tip - "Report a Bug..." in your engine's Meshy menu fills this form in for you.
      placeholder: "1.5.0 (Unity / Blender / Godot / Unreal)"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host application and version
      placeholder: "Unity 2022.3.x, Blender 5.x, Godot 4.3 or Unreal 5.4"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics and error output
      description: Paste the output of "Copy Diagnostics" from your engine's Meshy menu, plus any console errors.
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
