name: Publish browser-aware installer

on:
  push:
    branches:
      - main
      - feature/browser-aware-installer
    paths:
      - 'site/**'
      - '.github/workflows/deploy-installer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meshy-browser-installer-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy browser installer site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser routing
        run: node --test tests/installer-routing.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload installer site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment
