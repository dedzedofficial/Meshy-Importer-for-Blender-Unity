name: Refresh committed importer ZIPs (temporary)
on:
  push:
    branches: [feature/local-browser-asset-capture]
    paths: ['.github/workflows/refresh-archives.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current installer archives
        run: python tools/build_zips.py
      - name: Commit generated archives to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'blender/Meshy Importer for Blender & Unity - Blender.zip' 'unreal/Meshy Importer for Unreal.zip'
          if git diff --cached --quiet; then echo 'Archives already current'; exit 0; fi
          git commit -m 'Regenerate existing engine install ZIPs from current sources'
          git push origin HEAD:refs/heads/feature/local-browser-asset-capture
