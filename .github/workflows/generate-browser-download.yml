name: Generate browser installer ZIP (temporary)
on:
  push:
    branches: [feature/local-browser-asset-capture]
    paths: ['.github/workflows/generate-browser-download.yml']
permissions:
  contents: write
jobs:
  browser-zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the browser ZIP from source
        run: |
          mkdir -p downloads
          python tools/build_zips.py
      - name: Commit direct download ZIP to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f downloads/Meshy-Importer-Browser.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Add ready-to-install browser ZIP for GitHub download button'
          git push origin HEAD:refs/heads/feature/local-browser-asset-capture
